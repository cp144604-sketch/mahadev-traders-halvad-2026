name: Build Mahadev Traders APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_DIR/licenses/intel-android-extra-license"
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure keystore and env fallback
        shell: bash
        run: |
          if [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          [ -f .env.example ] || touch .env.example

      - name: Build Debug APK
        shell: bash
        run: |
          ls -lh app/google-services.json || echo "NOTICE: app/google-services.json not present in repo"
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --no-configuration-cache --max-workers=2 --console=plain -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" 2>&1 | tee build.log; then
            echo "=== COMPILER ERRORS ==="
            grep -E "^e: |Unresolved|FAILURE:" build.log | head -n 30 || true
            echo "=== FAILURE DETAILS ==="
            grep -A 15 "What went wrong:" build.log || tail -n 30 build.log
            exit 1
          fi

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk MahadevTraders.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MahadevTraders-APK
          path: MahadevTraders.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mahadev Traders App (APK)
          body: "મહાદેવ ટ્રેડર્સ - અનાજ ભાવ એપ (Direct Android APK)"
          files: MahadevTraders.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
