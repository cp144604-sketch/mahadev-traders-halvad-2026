name: Build Mahadev Traders APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk MahadevTraders.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MahadevTraders-APK
          path: MahadevTraders.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mahadev Traders App (APK)
          body: "મહાદેવ ટ્રેડર્સ - અનાજ ભાવ એપ (Direct Android APK)"
          files: MahadevTraders.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
